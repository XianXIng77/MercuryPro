services:
  mercurypro:
    image: mercurypro:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mercurypro
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      PORT: "9100"
      BROWSER_DEBUG_DESKTOP_ENABLED: "${BROWSER_DEBUG_DESKTOP_ENABLED:-false}"
      DISPLAY: ":99"
      VNC_PORT: "5900"
      NOVNC_WEB_ROOT: "/usr/share/novnc"
      VNC_SCREEN: "${VNC_SCREEN:-1440x900x24}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      APP_URL: "${APP_URL:-http://127.0.0.1:9100}"
      DATA_DIR: "/app/data"
      MICROSOFT_TOKEN_URL: "${MICROSOFT_TOKEN_URL:-https://login.microsoftonline.com/consumers/oauth2/v2.0/token}"
      MICROSOFT_MAIL_API_BASE_URL: "${MICROSOFT_MAIL_API_BASE_URL:-https://outlook.office.com/api/v2.0}"
    volumes:
      - ./data:/app/data
      - ./grok-engine/runtime/data:/app/grok-engine/runtime/data
      - ./grok-engine/config:/app/grok-engine/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
