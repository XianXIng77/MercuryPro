services:
  mercurypro:
    image: mercurypro:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mercurypro
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      NODE_ENV: production
      PORT: "9100"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      APP_URL: "${APP_URL:-http://127.0.0.1:9100}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
